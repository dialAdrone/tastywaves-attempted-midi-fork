name: Compile Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow uv lz4
          
      - name: Get Missing JieLi AC79 SDK Framework
        run: |
          git clone --depth=1 https://github.com /home/runner/fw-AC79_AIoT_SDK
          
      - name: Get JieLi Compiler Toolchain
        run: |
          mkdir -p /home/runner/.jieli
          wget -q https://jieliapp.com -O /home/runner/toolchain.tar.gz
          tar -xzf /home/runner/toolchain.tar.gz -C /home/runner/.jieli/

      - name: Execute Compiler inside 32-Bit Docker Sandbox
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_DOCKER: "1"
        run: |
          # 🐳 Mount paths and pass compilation instructions directly inside the docker context
          sudo chmod -R 777 /home/runner/.jieli/toolchain
          python tools/build.py
          
      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: tastywaves-firmware
          path: build/tastywaves.fwsc
