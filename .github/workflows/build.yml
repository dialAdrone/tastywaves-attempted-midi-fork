name: Compile Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow uv lz4
          
      - name: Enable 32-bit Architecture and Install System Dependencies
        run: |
          # 🔓 This fixes exit code 4 by installing the missing 32-bit core libraries
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32stdc++6 lib32z1
          
      - name: Get Missing JieLi AC79 SDK Framework
        run: |
          git clone --depth=1 https://github.com /home/runner/fw-AC79_AIoT_SDK
          
      - name: Get JieLi Compiler Toolchain
        run: |
          mkdir -p /home/runner/.jieli
          wget -q https://jieliapp.com -O /home/runner/toolchain.tar.gz
          tar -xzf /home/runner/toolchain.tar.gz -C /home/runner/.jieli/
          chmod +x /home/runner/.jieli/toolchain/pi32v2/bin/* || true
          chmod +x /home/runner/.jieli/toolchain/common/bin/* || true

      - name: Build Firmware Package Directly
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
        run: |
          python tools/build.py
          
      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: tastywaves-firmware
          path: build/tastywaves.fwsc
