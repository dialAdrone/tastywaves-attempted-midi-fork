name: Compile Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow uv
      - name: Get JieLi Toolchain
        run: tools/get_toolchain.sh || true
      - name: Build Firmware Package
        shell: bash
        run: ./build.sh
      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: tastywaves-firmware
          path: build/tastywaves.fwsc
