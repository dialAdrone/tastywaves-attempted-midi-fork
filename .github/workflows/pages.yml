# The website on GitHub Pages, at https://tastysynth.com: the landing page (site/) and the web tool at /tool/ (tools/web).
name: Website on GitHub Pages
on:
  push:
    branches: [main]
    paths: [site/**, docs/images/**, tools/web/**, tools/site_build.sh, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: tools/site_build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - id: deployment
        uses: actions/deploy-pages@v4
